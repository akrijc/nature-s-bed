name: Deploy demo na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # Web běží v podsložce https://USERNAME.github.io/REPOSITORY/
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # Najde skutečný výstupní adresář a připraví 404 fallback pro GitHub Pages.
      - name: Prepare GitHub Pages artifact
        run: |
          set -e
          if [ -f dist/client/index.html ]; then
            OUT_DIR="dist/client"
          elif [ -f dist/index.html ]; then
            OUT_DIR="dist"
          elif [ -f .output/public/index.html ]; then
            OUT_DIR=".output/public"
          else
            echo "ERROR: index.html not found in expected locations."
            echo "--- dist tree ---"
            find dist -maxdepth 3 -type f 2>/dev/null | head -50 || true
            echo "--- .output tree ---"
            find .output -maxdepth 3 -type f 2>/dev/null | head -50 || true
            exit 1
          fi
          echo "Build output directory: $OUT_DIR"
          cp "$OUT_DIR/index.html" "$OUT_DIR/404.html"
          touch "$OUT_DIR/.nojekyll"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
